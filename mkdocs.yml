site_name: Стайлгайд документации
site_description: Руководство по стилю технической документации веб/SaaS-продукта
site_author: style-guide-project
site_url: https://xwxffle.github.io/proj-doc/
repo_url: https://github.com/xWxfFle/proj-doc
repo_name: proj-doc

exclude_docs: |
  includes/**

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Светлая тема
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang: ru

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.snippets:
      base_path:
        - docs
      check_paths: true
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list

nav:
  - Главная: index.md
  - О стайлгайде:
      - Назначение и область: about/purpose.md
      - Как пользоваться: about/how-to-use.md
      - Как предложить изменение: contributing.md
  - Правила:
      - Язык и тон: rules/language.md
      - Структура документов: rules/structure.md
      - Форматирование: rules/formatting.md
      - Терминология: rules/terminology.md
      - Примеры кода: rules/code-examples.md
      - Заголовки и списки: rules/headings.md
      - Доступность текста: rules/accessibility.md
  - Примеры:
      - Хороший README: examples/readme.md
      - Фрагмент руководства: examples/user-guide.md
  - Лабораторная:
      - Ответы на вопросы: lab/answers.md
      - Тестирование стайлгайда: lab/testing.md
